name: Nifty Alpha Ladder Market-Data Probe

# One-off, read-only Kite capability check (A1/A7 empirical resolution) for
# NIFTY_ALPHA_LADDER_MARKET_DATA_CAPABILITY_REPORT.md — never places,
# modifies or cancels any order. Manual-dispatch only, kept for on-demand
# re-verification (e.g. if Kite's depth/historical API shape ever changes).
#
# Served from api/options-autotrade.ts, NOT a standalone
# api/nifty-alpha-ladder.ts file — a standalone 12th Vercel function
# confirmed live this session to break deployment on this project's Hobby
# plan (built clean, failed at Vercel's "Deploying outputs" stage). This is
# a shared-deployment-unit workaround only; the resource itself is fully
# isolated Nifty Alpha Ladder code, same as VWAP Scalper's own resources
# already coexisting in that file.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Nifty Alpha Ladder probe endpoint
        run: |
          curl -sf -X GET "https://thetalab-beta.vercel.app/api/options-autotrade?resource=alpha-ladder-probe" \
            -H "Authorization: Bearer ${{ secrets.OPTIONS_AUTOTRADE_CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
