name: Options Auto-Trader Paper Scan

# GitHub Actions' own `schedule:` trigger was found to fire only
# sporadically in practice (once or twice a day, sometimes hours late,
# instead of every 30 minutes) — same unreliability documented for VWAP
# scalper's cron. The real recurring trigger is now three external
# cron-job.org pingers (one per symbol: NIFTY, BANKNIFTY, SENSEX) hitting
# resource=paper-scan&symbol=<X> every 30 minutes during market hours;
# this workflow is manual-dispatch only, kept for on-demand diagnosis.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Underlying to scan (NIFTY | BANKNIFTY | SENSEX)'
        required: false
        default: 'NIFTY'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call paper-scan endpoint
        run: |
          curl -sf -X POST "https://thetalab-beta.vercel.app/api/options-autotrade?resource=paper-scan&symbol=${{ inputs.symbol || 'NIFTY' }}" \
            -H "Authorization: Bearer ${{ secrets.OPTIONS_AUTOTRADE_CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
