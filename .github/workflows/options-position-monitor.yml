name: Options Auto-Trader Position Monitor

# GitHub Actions' own `schedule:` trigger was found to fire only sporadically
# in practice (once or twice a day, sometimes hours late, instead of every
# 5 minutes) — the same unreliability documented for VWAP scalper's cron
# (see vwap-scalper-manual-test.yml and the cron-job.org setup notes). The
# real recurring trigger is now an external cron-job.org pinger hitting
# resource=position-monitor every 1 minute during market hours (tightened
# from 5 minutes to bound stop-loss/target slippage between checks — this
# endpoint doesn't place a real broker stop order, it only polls and
# closes at whatever the live re-quote is when a check catches the
# condition); this workflow is manual-dispatch only, kept for on-demand
# diagnosis.
on:
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Call position-monitor endpoint
        run: |
          curl -sf -X POST "https://thetalab-beta.vercel.app/api/options-autotrade?resource=position-monitor" \
            -H "Authorization: Bearer ${{ secrets.OPTIONS_AUTOTRADE_CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
